---
- name: CI/CD Pipeline for Microservices Application
  hosts: microservices
  gather_facts: true

  tasks:
    # --- ЭТАП 1: Получение изменений по SSH (п. 4) ---
    - name: Pull latest changes from Git repository
      ansible.builtin.git:
        repo: "git@github.com:Maria20112/ansible_lb6.git"
        dest: /tmp/PCPO
        version: main
        update: yes
      delegate_to: localhost
      run_once: true
      register: git_result

    # --- ЭТАП 3: Быстрая сверка конфигураций (ВСЕГДА, п. 5) ---
    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /app/config
        state: directory
        mode: '0755'
      become: true

    - name: Generate appsettings.json from template
      ansible.builtin.template:
        src: templates/appsettings.json.j2
        dest: /app/config/appsettings.json
        mode: '0644'
        backup: yes
      become: true
      
    - name: Validate secrets
      ansible.builtin.assert:
        that:
          - sonarqube_token is defined
          - sonarqube_token | length >= 20
          - sonarqube_token | length <= 200
          - sonarqube_token is match('^[a-zA-Z0-9_\\-\\.]+$')
        fail_msg: >
          CRITICAL: Secrets validation failed!
          Check group_vars/microservices/secrets.yml and vault password file.
        success_msg: "All secrets passed format validation."

    - name: CI - Run containerized SonarQube Scanner
      ansible.builtin.shell: |
        docker run --rm \
          -v /tmp/PCPO/{{ inventory_hostname }}:/usr/src \
          -w /usr/src \
          --add-host=host.docker.internal:host-gateway \
          sonarsource/sonar-scanner-cli \
          sonar-scanner -Dsonar.projectKey={{ inventory_hostname }} -Dsonar.sources=. \
          -Dsonar.host.url=http://host.docker.internal:9000 \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.token={{ sonarqube_token }}
      delegate_to: localhost
      when: git_result.changed
      register: ci_result
      ignore_errors: yes

    - name: Fail pipeline if CI fails
      ansible.builtin.fail:
        msg: "Static analysis failed for {{ inventory_hostname }}!"
      delegate_to: localhost
      when: ci_result is failed and git_result.changed

         # --- ЭТАП 5: CD - Сборка и развертывание (ОДИН РАЗ ДЛЯ ВСЕГО СТЕКА, п. 3) ---
    
    # 5.1. Гарантированная очистка старого стека для освобождения портов
    - name: CD - Ensure clean state (stop old containers holding ports)
      ansible.builtin.shell: |
        cd /tmp/PCPO
        docker compose down --remove-orphans || true
      delegate_to: localhost
      run_once: true
      when: git_result.changed
      ignore_errors: true # Игнорируем ошибку, если стека еще не существует

    # 5.2. Сборка и запуск актуального стека
    - name: CD - Build and deploy unified Docker Compose stack
      ansible.builtin.shell: |
        cd /tmp/PCPO
        docker compose up -d --build --remove-orphans
      delegate_to: localhost
      run_once: true
      when: git_result.changed
      register: cd_result

    - name: Verify deployment status
      ansible.builtin.debug:
        msg: "Deployment of the entire microservices stack completed successfully."
      delegate_to: localhost
      run_once: true
      when: git_result.changed