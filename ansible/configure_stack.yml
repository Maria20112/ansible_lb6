---
- name: CI/CD Pipeline for Microservices Application
  hosts: microservices
  gather_facts: true

  tasks:
    # --- ЭТАП 1: Получение изменений на Control Node ---
    - name: Pull latest changes from Git repository
      ansible.builtin.git:
        repo: "file:///opt/git-repo/microservices.git"
        dest: /tmp/microservices_src_control
        version: main
        update: yes
      delegate_to: localhost
      run_once: true
      register: git_result

    # --- ЭТАП 2: Синхронизация кода на целевые хосты (для конфигурации) ---
    - name: Synchronize code to target hosts
      ansible.posix.synchronize:
        src: /tmp/microservices_src_control/
        dest: /opt/microservices_src/
        delete: yes
      become: true
      when: git_result.changed

    # --- ЭТАП 3: Быстрая сверка конфигураций (ВСЕГДА) ---
    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /app/config
        state: directory
        mode: '0755'
      become: true

    - name: Generate appsettings.json from template
      ansible.builtin.template:
        src: templates/appsettings.json.j2
        dest: /app/config/appsettings.json
        mode: '0644'
        backup: yes
      become: true

    # --- ЭТАП 4: CI (ВЫПОЛНЯЕМ НА LOCALHOST) ---
        # --- ЭТАП 4: CI (ВЫПОЛНЯЕМ НА LOCALHOST) ---
    - name: CI - Run containerized SonarQube Scanner
      ansible.builtin.shell: |
        docker run --rm \
          -v /tmp/microservices_src_control/{{ inventory_hostname }}:/usr/src \
          -w /usr/src \
          --add-host=host.docker.internal:host-gateway \
          sonarsource/sonar-scanner-cli \
          sonar-scanner -Dsonar.projectKey={{ inventory_hostname }} -Dsonar.sources=. \
          -Dsonar.host.url=http://host.docker.internal:9000 \
          -Dsonar.login={{ sonarqube_token }}
      delegate_to: localhost
      when: git_result.changed
      register: ci_result
      ignore_errors: yes

    - name: Fail pipeline if CI fails
      ansible.builtin.fail:
        msg: "Static analysis failed for {{ inventory_hostname }}!"
      delegate_to: localhost
      when: ci_result is failed and git_result.changed

    # --- ЭТАП 5: CD (ВЫПОЛНЯЕМ НА LOCALHOST) ---
    - name: CD - Build and deploy Docker Compose stack
      ansible.builtin.shell: |
        cd /tmp/microservices_src_control/{{ inventory_hostname }}
        docker compose up -d --build
      delegate_to: localhost
      when: git_result.changed
      register: cd_result

    - name: Verify deployment status
      ansible.builtin.debug:
        msg: "Deployment of {{ inventory_hostname }} completed successfully."
      delegate_to: localhost
      when: git_result.changed