---
- name: CI/CD Pipeline for Microservices Application
  hosts: microservices
  gather_facts: true

  tasks:
    # 0. Подготовка окружения на целевых хостах
    - name: Install required packages (Docker, Git, Compose, rsync)
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose # Современный пакет для docker compose
          - rsync                 # Необходим для модуля synchronize
        state: present
        update_cache: yes
      become: true

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
      become: true

    # --- ЭТАП 1: Получение изменений на Control Node (Пункт 4) ---
    # Мы клонируем на localhost, чтобы использовать его SSH-ключи для Git
    - name: Pull latest changes from Git repository to Control Node
      ansible.builtin.git:
        repo: "file:///opt/git-repo/microservices.git" # Замените на ваш SSH URL (или file:/// если локальный bare repo)
        dest: /tmp/microservices_src_control
        version: test_branch
        update: yes
        accept_hostkey: yes
      delegate_to: localhost
      run_once: true
      register: git_result

    # --- ЭТАП 2: Синхронизация кода с Control Node на Target Hosts ---
    # Решает проблему "пустых целевых хостов"
    - name: Synchronize fresh code from Control Node to Target Hosts
      ansible.posix.synchronize:
        src: /tmp/microservices_src_control/ # Слэш в конце важен! Копирует содержимое папки
        dest: /opt/microservices_src/
        delete: yes                          # Удаляет старые файлы, которых нет в репозитории
      become: true
      when: git_result.changed               # Пункт 5: Оптимизация

    # --- ЭТАП 3: Быстрая сверка конфигураций (ВСЕГДА, даже если нет изменений) ---
    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /app/config
        state: directory
        mode: '0755'
      become: true

    - name: Generate appsettings.json from Jinja2 template
      ansible.builtin.template:
        src: templates/appsettings.json.j2
        dest: /app/config/appsettings.json
        mode: '0644'
        backup: yes
      become: true

    # --- ЭТАП 4: CI (Только если были изменения в Git) ---
    - name: CI - Run containerized SonarQube Scanner
      ansible.builtin.shell: |
        docker run --rm \
          -v /opt/microservices_src/{{ inventory_hostname }}:/usr/src \
          -w /usr/src \
          sonarsource/sonar-scanner-cli \
          sonar-scanner -Dsonar.projectKey={{ inventory_hostname }} -Dsonar.sources=. \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login={{ sonarqube_token }}
      become: true
      when: git_result.changed
      register: ci_result
      ignore_errors: yes

    - name: Fail pipeline if CI fails
      ansible.builtin.fail:
        msg: "Static analysis (SonarQube) failed for {{ inventory_hostname }}!"
      become: true
      when: ci_result is failed and git_result.changed

    # --- ЭТАП 5: CD (Только если были изменения в Git) ---
    - name: CD - Build and deploy Docker Compose stack
      ansible.builtin.shell: |
        cd /opt/microservices_src/{{ inventory_hostname }}
        docker compose up -d --build
      become: true
      when: git_result.changed
      register: cd_result

    - name: Verify deployment status
      ansible.builtin.debug:
        msg: "Deployment of {{ inventory_hostname }} completed successfully."
      when: git_result.changed