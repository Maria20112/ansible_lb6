---
# === PLAY 1: Оркестрация на localhost ===
- name: CI/CD Pipeline Orchestrator
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    repo_url: "git@gitea.local:devs/microservices.git"
    repo_dest: "/opt/ansible-cicd/workspace"
    repo_version: "main"
    home_dir: "{{ lookup('env', 'HOME') }}"

  tasks:
    # === ЭТАП 4: Получение изменений по SSH ===
    - name: Ensure workspace directory exists
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        mode: '0755'

    - name: Pull latest changes from Git repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_version }}"
        key_file: "{{ home_dir }}/.ssh/id_rsa"
        accept_hostkey: yes
        force: yes
      register: git_pull_result

    # === ЭТАП 5: Оптимизация ===
    - name: Determine execution mode based on Git changes
      ansible.builtin.set_fact:
        run_heavy_tasks: "{{ git_pull_result.changed | bool }}"
        last_commit: "{{ git_pull_result.after | default('none') }}"

    - name: Display execution mode
      ansible.builtin.debug:
        msg: ">>> Mode: {{ 'FULL CI/CD' if run_heavy_tasks else 'FAST VALIDATION' }} | commit: {{ last_commit }}"

    # === БЫСТРАЯ ВАЛИДАЦИЯ (выполняется всегда) ===
    - name: Validate Ansible syntax
      ansible.builtin.command:
        cmd: ansible-playbook playbooks/deploy_app.yml --syntax-check -i inventory.ini
      changed_when: false

    - name: Validate vault decryption
      ansible.builtin.command:
        cmd: ansible-vault view --vault-id main@/root/.vault/main_key group_vars/microservices/secrets.yml
      register: vault_check
      changed_when: false
      failed_when: "'db_password' not in vault_check.stdout"

    - name: Vault validation success
      ansible.builtin.debug:
        msg: "Vault decrypted successfully, secrets are valid."

    # === ЭТАП 3: CI (только при изменениях) ===
    - name: Run SonarQube Scanner via Docker
      community.docker.docker_container:
        name: sonar-scanner-ci
        image: sonarsource/sonar-scanner-cli:latest
        auto_remove: true
        volumes:
          - "{{ repo_dest }}:/usr/src"
        env:
          SONAR_HOST_URL: "http://sonarqube.local:9000"
          SONAR_TOKEN: "dummy_token"
      when: run_heavy_tasks | bool
      ignore_errors: yes

    - name: Run automated tests
      ansible.builtin.command:
        cmd: "docker run --rm -v {{ repo_dest }}:/app -w /app python:3.10-slim pytest /app/tests/ -v"
      register: test_result
      when: run_heavy_tasks | bool
      changed_when: false
      failed_when:
        - test_result.rc != 0
        - test_result.rc != 5

    # === ЭТАП 3: CD (только при изменениях) ===
    - name: Build Docker images
      ansible.builtin.command:
        cmd: docker compose build
        args:
          chdir: "{{ repo_dest }}"
      when: run_heavy_tasks | bool
      changed_when: true

    - name: Deploy application via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dest }}"
        state: present
        rebuild: always
      when: run_heavy_tasks | bool
      register: compose_result

# === PLAY 2: Развёртывание на целевые хосты ===
- name: Deploy application to target hosts
  hosts: microservices
  become: true
  gather_facts: false
  vars:
    run_heavy_tasks: "{{ hostvars['localhost'].run_heavy_tasks | default(false) | bool }}"

  pre_tasks:
    - name: Skip deployment if no changes detected
      ansible.builtin.meta: end_play
      when: not (run_heavy_tasks | bool)

  tasks:
    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /app/config
        state: directory
        mode: '0755'

    - name: Generate appsettings.json from Jinja2 template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/appsettings.json.j2"
        dest: /app/config/appsettings.json
        mode: '0644'
        backup: yes
      register: template_result
      notify: restart app service

  handlers:
    - name: Restart app service
      ansible.builtin.systemd:
        name: app.service
        state: restarted
        enabled: yes
      when: template_result is changed
